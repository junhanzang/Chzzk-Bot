name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows tests and distribution
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked build dependencies
        run: npm ci --prefix desktop
      - name: Check versions, syntax, module boundaries and tests
        run: |
          node scripts/release-bundle.cjs metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check --prefix desktop
      - name: Verify RPC recording and MP4 decoding without opening apps
        run: npm run test:browser-replay --prefix desktop
      - name: Package Chrome extension
        run: npm run package --prefix browser-extension
      - name: Package and inspect Windows app
        run: npm run dist:win --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Assemble release files and SHA-256 checksums
        run: node scripts/release-bundle.cjs pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chzzk-desk-distribution
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  python:
    name: Python bot unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Include mocked HTTP/config imports; no GPU, account or audio dependencies.
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest tests -q
